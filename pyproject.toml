[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "woordjes"
version = "0.1.0"
description = "A small command-line Dutch vocabulary trainer with spaced repetition"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Faezeh Hesari Shermeh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
woordjes = "woordjes.cli:main"

[tool.setuptools]
packages = ["woordjes"]
